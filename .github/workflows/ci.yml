name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forensix
          POSTGRES_PASSWORD: forensix_dev_password
          POSTGRES_DB: forensix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://forensix:forensix_dev_password@localhost:5432/forensix

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Download test dataset fixture
        run: python scripts/download_test_dataset.py

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest --cov=forensix --cov-report=term-missing

