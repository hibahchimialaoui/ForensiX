[project]
name = "forensix"
version = "0.1.0"
description = "Evidence-driven Digital Forensics & Incident Response platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-evtx>=0.8", "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "alembic>=1.13", "networkx>=3.0", "streamlit>=1.30", "pysigma>=1.5.0,<2.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]



