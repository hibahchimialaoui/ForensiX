services:
  postgres:
    image: postgres:16
    container_name: forensix-postgres
    environment:
      POSTGRES_USER: forensix
      POSTGRES_PASSWORD: forensix_dev_password
      POSTGRES_DB: forensix
    ports:
      - "5432:5432"
    volumes:
      - forensix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensix"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: forensix-api
    environment:
      DATABASE_URL: postgresql://forensix:forensix_dev_password@postgres:5432/forensix
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  forensix_pgdata:
